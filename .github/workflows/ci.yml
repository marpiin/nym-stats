name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
      # The tests never reach the network: every request goes through a fake session.
      - name: Scan tracked files for secrets
        if: runner.os == 'Linux'
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      # detect-secrets 1.5.0 did not flag a Telegram-shaped token when I tried it,
      # and that token is the one secret this project handles.
      - name: Look for Telegram bot tokens
        if: runner.os == 'Linux'
        run: "! git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{35}'"
